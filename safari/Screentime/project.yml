name: Screentime
options:
  bundleIdPrefix: com.screentime
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Screentime:
    type: application
    platform: macOS
    sources:
      - path: Screentime
        excludes:
          - "*.entitlements"
    info:
      path: Screentime/Info.plist
      properties:
        CFBundleDisplayName: ScreenFry
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: Screentime/Screentime.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        # The user-facing name. Bundle identifiers stay com.screentime.* so Safari keeps
        # the existing registration and the settings stored against it.
        PRODUCT_NAME: ScreenFry
        PRODUCT_BUNDLE_IDENTIFIER: com.screentime.Screentime
        MARKETING_VERSION: "0.4.2"
        CURRENT_PROJECT_VERSION: "11"
    dependencies:
      - target: Screentime Extension
        embed: true
  Screentime Extension:
    type: app-extension
    platform: macOS
    sources:
      - path: Screentime Extension
        excludes:
          - Resources
          - "*.entitlements"
      # Safari reads manifest.json from the root of the appex Resources directory, so the
      # top-level files are added individually; assets/ and icons/ retain their folder paths.
      - path: Screentime Extension/Resources
        type: group
        buildPhase: resources
        excludes:
          - assets
          - "assets/**"
          - icons
          - "icons/**"
      - path: Screentime Extension/Resources/assets
        type: folder
        buildPhase: resources
      - path: Screentime Extension/Resources/icons
        type: folder
        buildPhase: resources
    info:
      path: Screentime Extension/Info.plist
      properties:
        CFBundleDisplayName: ScreenFry Extension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SafariWebExtensionHandler"
    entitlements:
      path: Screentime Extension/Screentime Extension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: ScreenFry Extension
        PRODUCT_BUNDLE_IDENTIFIER: com.screentime.Screentime.Extension
        MARKETING_VERSION: "0.4.2"
        CURRENT_PROJECT_VERSION: "11"
