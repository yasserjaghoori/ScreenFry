name: Screentime
options:
  bundleIdPrefix: com.screentime
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
packages:
  # In-app updates from GitHub Releases (docs/DISTRIBUTION.md).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"
targets:
  Screentime:
    type: application
    platform: macOS
    sources:
      - path: Screentime
        excludes:
          - "*.entitlements"
          - ChromeExtension
          - "ChromeExtension/**"
      # The Chrome build, copied by `npm run build:safari`. The app installs it into
      # ~/Library/Application Support/ScreenFry/Chrome Extension for Chrome to load.
      - path: Screentime/ChromeExtension
        type: folder
        buildPhase: resources
    info:
      path: Screentime/Info.plist
      properties:
        CFBundleDisplayName: ScreenFry
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Sparkle: checks this feed daily and offers updates. SUPublicEDKey stays empty
        # (updates off) until a release signing key is generated; see docs/DISTRIBUTION.md.
        SUFeedURL: https://github.com/yasserjaghoori/Screentime/releases/latest/download/appcast.xml
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    # The app is not sandboxed: it writes the Chrome folder where Chrome can read it and lets
    # Sparkle replace the app. The Safari extension inside it stays sandboxed.
    entitlements:
      path: Screentime/Screentime.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: false
    settings:
      base:
        # The user-facing name. Bundle identifiers stay com.screentime.* so Safari keeps
        # the existing registration and the settings stored against it.
        PRODUCT_NAME: ScreenFry
        PRODUCT_BUNDLE_IDENTIFIER: com.screentime.Screentime
        # Required for notarization once the app is Developer ID signed.
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "20"
    dependencies:
      - target: Screentime Extension
        embed: true
      - package: Sparkle
  Screentime Extension:
    type: app-extension
    platform: macOS
    sources:
      - path: Screentime Extension
        excludes:
          - Resources
          - "*.entitlements"
      # Safari reads manifest.json from the root of the appex Resources directory, so the
      # top-level files are added individually; assets/ and icons/ retain their folder paths.
      - path: Screentime Extension/Resources
        type: group
        buildPhase: resources
        excludes:
          - assets
          - "assets/**"
          - icons
          - "icons/**"
      - path: Screentime Extension/Resources/assets
        type: folder
        buildPhase: resources
      - path: Screentime Extension/Resources/icons
        type: folder
        buildPhase: resources
    info:
      path: Screentime Extension/Info.plist
      properties:
        CFBundleDisplayName: ScreenFry Extension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SafariWebExtensionHandler"
    entitlements:
      path: Screentime Extension/Screentime Extension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: ScreenFry Extension
        PRODUCT_BUNDLE_IDENTIFIER: com.screentime.Screentime.Extension
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "20"
