name: Screentime
options:
  bundleIdPrefix: com.screentime
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Screentime:
    type: application
    platform: macOS
    sources:
      - path: Screentime
    info:
      path: Screentime/Info.plist
      properties:
        CFBundleDisplayName: Screentime
        LSApplicationCategoryType: public.app-category.productivity
    dependencies:
      - target: Screentime Extension
        embed: true
  Screentime Extension:
    type: app-extension
    platform: macOS
    sources:
      - path: Screentime Extension
        excludes:
          - Resources
      - path: Screentime Extension/Resources
        type: folder
        buildPhase: resources
    info:
      path: Screentime Extension/Info.plist
      properties:
        CFBundleDisplayName: Screentime Extension
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SafariWebExtensionHandler"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screentime.Screentime.Extension
