<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- ScreenFry's logo as a menu bar silhouette: a monitor with a clock, dripping, on a stand.
       Drawn black on transparent; the app uses it as a template image, so macOS colors it. -->
  <defs>
    <mask id="face">
      <rect width="36" height="36" fill="white"/>
      <circle cx="18" cy="15" r="7.2" fill="black"/>
      <path d="M18 15 V10.2 M18 15 H21.6" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#face)" fill="black">
    <rect x="2.5" y="3.5" width="31" height="22.5" rx="5.5"/>
    <!-- drips running off the bottom right -->
    <path d="M22.5 24 h4 v5.2 a2 2 0 0 1 -4 0 z"/>
    <path d="M28.6 24 h3 v2.8 a1.5 1.5 0 0 1 -3 0 z"/>
  </g>
  <rect x="13.5" y="25" width="6" height="5" fill="black"/>
  <rect x="9.5" y="29.5" width="12" height="3" rx="1.5" fill="black"/>
</svg>
