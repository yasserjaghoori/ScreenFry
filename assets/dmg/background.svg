<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- Finder shows an installer's background as a still image, so the drip is drawn mid-fall. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#ffd9bd"/><stop offset="1" stop-color="#f8f3ec"/></radialGradient>
    <linearGradient id="oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4621f"/><stop offset="1" stop-color="#ff9a4d"/></linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc46c"/><stop offset="1" stop-color="#f76b36"/></linearGradient>
  </defs>
  <rect width="660" height="400" fill="url(#glow)"/>
  <!-- Oil running down from the top edge. -->
  <path fill="url(#oil)" d="M0 0 H660 V14
    C648 14 646 22 640 22 C632 22 632 14 620 14
    H574 C566 14 566 44 556 44 C546 44 546 14 538 14
    H470 C462 14 463 28 455 28 C447 28 448 14 440 14
    H300 C292 14 292 36 283 36 C274 36 274 14 266 14
    H178 C170 14 171 26 163 26 C155 26 156 14 148 14
    H96 C88 14 88 52 78 52 C68 52 68 14 60 14
    H28 C20 14 21 22 14 22 C7 22 7 14 0 14 Z"/>
  <ellipse cx="78" cy="66" rx="4.5" ry="6.5" fill="url(#drop)" opacity="0.85"/>
  <ellipse cx="556" cy="58" rx="4" ry="6" fill="url(#drop)" opacity="0.8"/>
  <ellipse cx="283" cy="47" rx="3" ry="4.5" fill="url(#drop)" opacity="0.6"/>
  <text x="330" y="84" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" font-weight="800" font-size="26" fill="#261e18">Install ScreenFry</text>
  <text x="330" y="111" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" font-weight="500" font-size="14" fill="#7c6f65">Drag ScreenFry onto the Applications folder, then open it there.</text>
  <!-- The arrow, dripping as it goes. -->
  <path d="M262 190 H398" stroke="#f4621f" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14" fill="none"/>
  <path d="M392 174 L414 190 L392 206" stroke="#f4621f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M310 193 C310 199 307 202 307 205 C307 209 313 209 313 205 C313 202 310 199 310 193 Z" fill="url(#drop)"/>
  <ellipse cx="310" cy="220" rx="2.6" ry="3.8" fill="url(#drop)" opacity="0.75"/>
  <path d="M358 193 C358 197 356 199 356 201 C356 204 360 204 360 201 C360 199 358 197 358 193 Z" fill="url(#drop)" opacity="0.9"/>
  <ellipse cx="358" cy="231" rx="2" ry="3" fill="url(#drop)" opacity="0.55"/>
  <ellipse cx="334" cy="246" rx="34" ry="3" fill="#f4621f" opacity="0.12"/>
  <text x="330" y="352" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" font-weight="500" font-size="12" fill="#9a8c80">Updating? Drag the new ScreenFry here and choose Replace. Your settings are kept.</text>
</svg>
