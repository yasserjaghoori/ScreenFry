<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#ffd9bd"/><stop offset="1" stop-color="#f8f3ec"/></radialGradient>
  </defs>
  <rect width="660" height="400" fill="url(#glow)"/>
  <text x="330" y="62" text-anchor="middle" font-family="Inter" font-weight="800" font-size="26" fill="#261e18">Install ScreenFry</text>
  <text x="330" y="90" text-anchor="middle" font-family="Inter" font-weight="500" font-size="14" fill="#7c6f65">Drag ScreenFry onto the Applications folder, then open it there.</text>
  <text x="330" y="112" text-anchor="middle" font-family="Inter" font-weight="600" font-size="12.5" fill="#c9460f">ScreenFry closes this window and confirms it’s installed.</text>
  <path d="M262 190 H398" stroke="#f4621f" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14" fill="none"/>
  <path d="M392 174 L414 190 L392 206" stroke="#f4621f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="330" y="344" text-anchor="middle" font-family="Inter" font-weight="500" font-size="12" fill="#9a8c80">Updating? Drag the new ScreenFry here and choose Replace. Your settings are kept.</text>
  <text x="330" y="364" text-anchor="middle" font-family="Inter" font-weight="500" font-size="12" fill="#9a8c80">Opened it from here by mistake? ScreenFry offers to move itself to Applications.</text>
</svg>
