<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440">
  <!-- Finder shows an installer's background as a still image, so the drip is drawn mid-fall.
       The two ScreenFrys sit at x 150 and 350, Applications at 610 (scripts/make-dmg.mjs);
       render with `node scripts/render-dmg-background.mjs`. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#ffd9bd"/><stop offset="1" stop-color="#f8f3ec"/></radialGradient>
    <linearGradient id="oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4621f"/><stop offset="1" stop-color="#ff9a4d"/></linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc46c"/><stop offset="1" stop-color="#f76b36"/></linearGradient>
  </defs>
  <rect width="760" height="440" fill="url(#glow)"/>
  <!-- Oil running down from the top edge. -->
  <path fill="url(#oil)" d="M0 0 H760 V14
    C748 14 746 22 740 22 C732 22 732 14 720 14
    H664 C656 14 656 44 646 44 C636 44 636 14 628 14
    H540 C532 14 533 28 525 28 C517 28 518 14 510 14
    H350 C342 14 342 36 333 36 C324 36 324 14 316 14
    H208 C200 14 201 26 193 26 C185 26 186 14 178 14
    H106 C98 14 98 52 88 52 C78 52 78 14 70 14
    H28 C20 14 21 22 14 22 C7 22 7 14 0 14 Z"/>
  <ellipse cx="88" cy="66" rx="4.5" ry="6.5" fill="url(#drop)" opacity="0.85"/>
  <ellipse cx="646" cy="58" rx="4" ry="6" fill="url(#drop)" opacity="0.8"/>
  <ellipse cx="333" cy="47" rx="3" ry="4.5" fill="url(#drop)" opacity="0.6"/>
  <text x="380" y="88" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" font-weight="800" font-size="26" fill="#261e18">Install ScreenFry</text>
  <text x="380" y="115" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" font-weight="500" font-size="14" fill="#7c6f65">Drag one of the two onto the Applications folder, then open it there.</text>
  <!-- The arrow, dripping as it goes. -->
  <path d="M434 210 H518" stroke="#f4621f" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14" fill="none"/>
  <path d="M512 194 L534 210 L512 226" stroke="#f4621f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M466 213 C466 219 463 222 463 225 C463 229 469 229 469 225 C469 222 466 219 466 213 Z" fill="url(#drop)"/>
  <ellipse cx="466" cy="240" rx="2.6" ry="3.8" fill="url(#drop)" opacity="0.75"/>
  <ellipse cx="484" cy="266" rx="30" ry="3" fill="#f4621f" opacity="0.12"/>
  <!-- One line under each choice (Finder draws the names just above). -->
  <g font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">
    <text x="150" y="306" font-weight="700" font-size="12" fill="#c9460f">Recommended</text>
    <text x="150" y="324" font-weight="500" font-size="12" fill="#7c6f65">Chrome gets it from the</text>
    <text x="150" y="340" font-weight="500" font-size="12" fill="#7c6f65">Chrome Web Store</text>
    <text x="350" y="306" font-weight="700" font-size="12" fill="#8a8079">For developers</text>
    <text x="350" y="324" font-weight="500" font-size="12" fill="#7c6f65">Chrome loads it unpacked,</text>
    <text x="350" y="340" font-weight="500" font-size="12" fill="#7c6f65">in Developer mode</text>
  </g>
  <text x="380" y="404" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" font-weight="500" font-size="12" fill="#9a8c80">Safari is the same in both. Updating? Drag the same one again and choose Replace; settings are kept.</text>
</svg>
